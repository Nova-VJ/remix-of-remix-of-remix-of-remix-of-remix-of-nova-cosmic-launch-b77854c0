# Publica a Sara (función sara-chat del proyecto «Nova Solutions Chatbot», dnnqeydtybmzriyjqqyt) cada vez que cambia
# su código o lo que sabe (supabase/functions/sara-chat/), o a mano desde Actions → «Publicar Sara» → Run workflow.
# Necesita el secreto SUPABASE_ACCESS_TOKEN del repositorio (Supabase → Account → Access Tokens); la clave nunca va en el código.
# Sara funciona sin sesión de Supabase: se publica con --no-verify-jwt, como hasta ahora.
name: Publicar Sara

on:
  push:
    branches: [main]
    paths: ['supabase/functions/sara-chat/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar el secreto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar sara-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sara-chat --project-ref dnnqeydtybmzriyjqqyt --no-verify-jwt --use-api
      - name: Comprobar que Sara responde
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "https://dnnqeydtybmzriyjqqyt.supabase.co/functions/v1/sara-chat")
          echo "sara-chat responde: $code"
          [ "$code" -lt 500 ]
